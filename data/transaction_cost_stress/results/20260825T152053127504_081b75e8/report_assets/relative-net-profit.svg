<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">EA別 Net Profit相対指数</title>
  <desc id="chart-desc">各EAの4WF合計Net ProfitをS=0を100として比較した折れ線グラフ。</desc>
  <style>
    .chart-background { fill: #ffffff; }
    text { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; fill: #111827; font-weight: 400; }
    .title { font-size: 24px; font-weight: 500; }
    .subtitle { font-size: 16px; fill: #374151; }
    .panel-title { font-size: 18px; font-weight: 500; }
    .axis-label { font-size: 15px; fill: #374151; }
    .value-label { font-size: 14px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .legend-label { font-size: 15px; font-weight: 500; }
    .axis { stroke: #4b5563; stroke-width: 1.4; }
    .grid { stroke: #cbd0d7; stroke-width: 1; }
    .panel { fill: none; stroke: #aeb5bf; stroke-width: 1.2; }
    .line { fill: none; stroke-width: 3; }
    .mark { stroke-width: 2.5; fill: #ffffff; }
    .series-1 { stroke: #2463a9; }
    .series-2 { stroke: #b25b22; }
    .series-3 { stroke: #2d8062; }
    .series-4 { stroke: #8156a8; }
    @media (prefers-color-scheme: dark) {
      .chart-background { fill: #17191d; }
      text { fill: #f3f4f6; } .subtitle, .axis-label { fill: #d1d5db; }
      .value-label { stroke: #17191d; }
      .axis { stroke: #c5cad1; } .grid, .panel { stroke: #555c66; } .mark { fill: #17191d; }
      .series-1 { stroke: #6da9e5; } .series-2 { stroke: #e59a66; }
      .series-3 { stroke: #70c3a3; } .series-4 { stroke: #b99adb; }
    }
  </style>
  <rect class="chart-background" x="0" y="0" width="1060" height="520" />
  <text class="title" x="90" y="35">EA別 Net Profit相対指数（S=0を100）</text>
  <text class="subtitle" x="90" y="59">4WF合計。異なる利益規模のEAを同じ尺度で比較</text>
  <line class="grid" x1="90" y1="450.0" x2="990" y2="450.0" />
  <text class="axis-label" x="78" y="454.0" text-anchor="end">30</text>
  <line class="grid" x1="90" y1="364.6" x2="990" y2="364.6" />
  <text class="axis-label" x="78" y="368.6" text-anchor="end">50</text>
  <line class="grid" x1="90" y1="279.3" x2="990" y2="279.3" />
  <text class="axis-label" x="78" y="283.3" text-anchor="end">70</text>
  <line class="grid" x1="90" y1="193.9" x2="990" y2="193.9" />
  <text class="axis-label" x="78" y="197.9" text-anchor="end">90</text>
  <line class="grid" x1="90" y1="151.2" x2="990" y2="151.2" />
  <text class="axis-label" x="78" y="155.2" text-anchor="end">100</text>
  <line class="grid" x1="90" y1="108.5" x2="990" y2="108.5" />
  <text class="axis-label" x="78" y="112.5" text-anchor="end">110</text>
  <line class="axis" x1="90" y1="100" x2="90" y2="450" />
  <line class="axis" x1="90" y1="450" x2="990" y2="450" />
  <text class="axis-label" x="90.0" y="477" text-anchor="middle">S=0</text>
  <text class="axis-label" x="390.0" y="477" text-anchor="middle">S=2</text>
  <text class="axis-label" x="690.0" y="477" text-anchor="middle">S=5</text>
  <text class="axis-label" x="990.0" y="477" text-anchor="middle">S=10</text>
  <text class="axis-label" x="540.0" y="504" text-anchor="middle">stress points / side</text>
  <path class="line series-1" d="M 90.0 151.2 L 390.0 152.1 L 690.0 158.6 L 990.0 167.3" />
  <circle class="mark series-1" cx="90.0" cy="151.2" r="5.5" />
  <text class="value-label" x="106.0" y="140.2" text-anchor="start">100.0（全EA）</text>
  <circle class="mark series-1" cx="390.0" cy="152.1" r="5.5" />
  <text class="value-label" x="390.0" y="141.1" text-anchor="middle">99.8</text>
  <circle class="mark series-1" cx="690.0" cy="158.6" r="5.5" />
  <text class="value-label" x="690.0" y="147.6" text-anchor="middle">98.3</text>
  <circle class="mark series-1" cx="990.0" cy="167.3" r="5.5" />
  <text class="value-label" x="990.0" y="156.3" text-anchor="middle">96.2</text>
  <path class="line series-2" d="M 90.0 151.2 L 390.0 193.3 L 690.0 203.5 L 990.0 425.4" />
  <rect class="mark series-2" x="84.5" y="145.7" width="11" height="11" />
  <rect class="mark series-2" x="384.5" y="187.8" width="11" height="11" />
  <text class="value-label" x="390.0" y="212.3" text-anchor="middle">90.1</text>
  <rect class="mark series-2" x="684.5" y="198.0" width="11" height="11" />
  <text class="value-label" x="690.0" y="222.5" text-anchor="middle">87.7</text>
  <rect class="mark series-2" x="984.5" y="419.9" width="11" height="11" />
  <text class="value-label" x="990.0" y="444.4" text-anchor="middle">35.8</text>
  <path class="line series-3" d="M 90.0 151.2 L 390.0 139.3 L 690.0 128.2 L 990.0 114.9" />
  <polygon class="mark series-3" points="90.0,144.2 83.5,156.7 96.5,156.7" />
  <polygon class="mark series-3" points="390.0,132.3 383.5,144.8 396.5,144.8" />
  <text class="value-label" x="390.0" y="128.3" text-anchor="middle">102.8</text>
  <polygon class="mark series-3" points="690.0,121.2 683.5,133.7 696.5,133.7" />
  <text class="value-label" x="690.0" y="117.2" text-anchor="middle">105.4</text>
  <polygon class="mark series-3" points="990.0,107.9 983.5,120.4 996.5,120.4" />
  <text class="value-label" x="990.0" y="103.9" text-anchor="middle">108.5</text>
  <line class="line series-1" x1="180" y1="82" x2="208" y2="82" />
  <circle class="mark series-1" cx="194.0" cy="82.0" r="5.5" />
  <text class="legend-label" x="218" y="86">QQ</text>
  <line class="line series-2" x1="430" y1="82" x2="458" y2="82" />
  <rect class="mark series-2" x="438.5" y="76.5" width="11" height="11" />
  <text class="legend-label" x="468" y="86">Smart Gold Hunter</text>
  <line class="line series-3" x1="735" y1="82" x2="763" y2="82" />
  <polygon class="mark series-3" points="749.0,75.0 742.5,87.5 755.5,87.5" />
  <text class="legend-label" x="773" y="86">Wave Rider</text>
</svg>
