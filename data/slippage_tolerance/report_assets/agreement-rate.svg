<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">100-point基準との一致率</title>
  <desc id="chart-desc">100以外の16ケースについて、deal系列一致率と全主要指標一致率をモード別に示す。</desc>
  <style>
    .chart-background { fill: #ffffff; }
    text { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; fill: #111827; font-weight: 400; }
    .title { font-size: 24px; font-weight: 500; }
    .subtitle { font-size: 16px; fill: #374151; }
    .panel-title { font-size: 18px; font-weight: 500; }
    .axis-label { font-size: 14px; fill: #374151; }
    .value-label { font-size: 14px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .legend-label { font-size: 15px; font-weight: 500; }
    .axis { stroke: #4b5563; stroke-width: 1.4; }
    .grid { stroke: #cbd0d7; stroke-width: 1; }
    .panel { fill: none; stroke: #aeb5bf; stroke-width: 1.2; }
    .line { fill: none; stroke-width: 3; }
    .mark { stroke-width: 2.5; fill: #ffffff; }
    .series-1 { stroke: #2463a9; fill: #2463a9; }
    .series-2 { stroke: #b25b22; fill: #b25b22; }
    .series-3 { stroke: #2d8062; fill: #2d8062; }
    .bad { stroke: #a33a3a; fill: #a33a3a; }
    .neutral { stroke: #69717d; fill: #69717d; }
    @media (prefers-color-scheme: dark) {
      .chart-background { fill: #17191d; }
      text { fill: #f3f4f6; } .subtitle, .axis-label { fill: #d1d5db; }
      .value-label { stroke: #17191d; }
      .axis { stroke: #c5cad1; } .grid, .panel { stroke: #555c66; } .mark { fill: #17191d; }
      .series-1 { stroke: #6da9e5; fill: #6da9e5; }
      .series-2 { stroke: #e59a66; fill: #e59a66; }
      .series-3 { stroke: #70c3a3; fill: #70c3a3; }
      .bad { stroke: #e08080; fill: #e08080; }
      .neutral { stroke: #aeb5bf; fill: #aeb5bf; }
    }
  </style>
  <rect class="chart-background" x="0" y="0" width="1040" height="450" />
  <text class="title" x="70" y="40">100-point基準との一致率</text>
  <text class="subtitle" x="70" y="67">各モード16比較。100%は日時・方向・価格のdeal系列と主要指標がすべて一致</text>
  <text class="legend-label" x="280" y="105">deal系列一致</text>
  <text class="legend-label" x="610" y="105">全主要指標差=0</text>
  <text class="panel-title" x="70" y="169">No Delay</text>
  <rect class="panel" x="280" y="145" width="260" height="34" />
  <rect class="series-3" x="280" y="145" width="260" height="34" opacity="0.28" />
  <text class="value-label" x="410" y="168" text-anchor="middle">16/16 (100%)</text>
  <rect class="panel" x="610" y="145" width="260" height="34" />
  <rect class="series-3" x="610" y="145" width="260" height="34" opacity="0.28" />
  <text class="value-label" x="740" y="168" text-anchor="middle">16/16 (100%)</text>
  <text class="axis-label" x="900" y="168" text-anchor="middle">再現可能・差なし</text>
  <text class="panel-title" x="70" y="261">固定188ms</text>
  <rect class="panel" x="280" y="237" width="260" height="34" />
  <rect class="series-3" x="280" y="237" width="260" height="34" opacity="0.28" />
  <text class="value-label" x="410" y="260" text-anchor="middle">16/16 (100%)</text>
  <rect class="panel" x="610" y="237" width="260" height="34" />
  <rect class="series-3" x="610" y="237" width="260" height="34" opacity="0.28" />
  <text class="value-label" x="740" y="260" text-anchor="middle">16/16 (100%)</text>
  <text class="axis-label" x="900" y="260" text-anchor="middle">再現可能・差なし</text>
  <text class="panel-title" x="70" y="353">ランダム延滞</text>
  <rect class="panel" x="280" y="329" width="260" height="34" />
  <text class="value-label" x="410" y="352" text-anchor="middle">0/16 (0%)</text>
  <rect class="panel" x="610" y="329" width="260" height="34" />
  <text class="value-label" x="740" y="352" text-anchor="middle">0/16 (0%)</text>
  <text class="axis-label" x="900" y="352" text-anchor="middle">試行間の乱数が交絡</text>
</svg>
