    .heat-3 { fill: #60a5fa; } .heat-4 { fill: #2563eb; }
    .heat-value { font-size: 17px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
