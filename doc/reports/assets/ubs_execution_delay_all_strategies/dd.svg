      .grid { stroke: #4b5563; } .axis { stroke: #d1d5db; }
      .ohlc { fill: #60a5fa; } .real { fill: #34d399; }
      .negative { fill: #f87171; } .positive { fill: #34d399; }
      .below-target { fill: #94a3b8; }
