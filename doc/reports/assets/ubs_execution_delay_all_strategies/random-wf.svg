<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="845" viewBox="0 0 1200 845" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">ランダム遅延の四半期別損益差</title>
  <desc id="chart-desc">7戦略×4WF。平均と実測範囲。</desc>
<style>
    .bg { fill: #ffffff; }
